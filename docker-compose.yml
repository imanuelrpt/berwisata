services:
  db:
    image: postgres:16-alpine
    container_name: berwisata_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-berwisata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-berwisata}
      POSTGRES_DB: ${POSTGRES_DB:-berwisata}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-berwisata} -d ${POSTGRES_DB:-berwisata}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: berwisata_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-berwisata}:${POSTGRES_PASSWORD:-berwisata}@db:5432/${POSTGRES_DB:-berwisata}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/app/ml/models:/app/app/ml/models
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python scripts/seed.py --if-empty &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: berwisata_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
